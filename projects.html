<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://kiaan.onrender.com/">
<title>Kiaan Ganesh Shetty</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6e62'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='600' fill='%23f6f5f1' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f1;
    --fg: #1d2420;
    --muted: #5e6b63;
    --line: #d9d6cc;
    --accent: #2f6e62;
    --surface: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #121512;
      --fg: #edeee8;
      --muted: #97a39a;
      --line: #2a332e;
      --accent: #7fe0c8;
      --surface: #1a211c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #121512;
    --fg: #edeee8;
    --muted: #97a39a;
    --line: #2a332e;
    --accent: #7fe0c8;
    --surface: #1a211c;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  }
  .card{
    max-width: 380px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .mark{
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg);
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 1.4rem;
    margin: 0;
  }
  p{
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }
  a{
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }
  a:hover, a:focus-visible{
    opacity: 0.8;
  }
  .spinner{
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .spinner{ animation: none; }
  }
</style>
<div class="card">
  <span class="mark">K</span>
  <h1>Taking you home</h1>
  <p>This page moved. If nothing happens, <a href="/">go to the homepage</a>.</p>
  <span class="spinner" aria-hidden="true"></span>
</div>
